services:
  # 本地关系型数据库；本 Compose 不启动 API 或其他应用服务。
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # 账号和密码由 --env-file 提供，不在 YAML 中写入真实凭据。
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env.mysql}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in deploy/.env.mysql}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in deploy/.env.mysql}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env.mysql}"
    # 左侧为宿主机端口，可通过 MYSQL_PORT 改成其他未占用端口。
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    # 默认建库字符集支持中文和四字节 Unicode。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 命名卷使容器重建后数据仍保留；docker compose down 不会删除该卷。
    volumes:
      - aiden_mysql_data:/var/lib/mysql
    # 健康检查通过 root ping 等待 MySQL 接受连接。
    # 测试命令中的 $$ 会延迟变量展开，让容器内 shell 读取密码变量。
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  aiden_mysql_data:
